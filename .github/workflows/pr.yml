name: PR

on:
  pull_request:
    paths-ignore:
      - '**/*.md'

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate-powershell-scripts:
    strategy:
      matrix:
        runner: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Validate PowerShell script syntax
        shell: pwsh
        run: ./scripts/Verify-PowerShellSyntax.ps1

      - name: Validate Windows installer provenance
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $fixtureDirectory = Join-Path $env:RUNNER_TEMP 'installer-provenance'
          # v0.0.16 has a valid signature whose timestamp certificate expired in October 2026.
          gh release download v0.0.16 --repo DamianEdwards/copilotd --pattern copilotd-win-x64.zip --dir $fixtureDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download the installer provenance fixture.' }
          Expand-Archive -LiteralPath (Join-Path $fixtureDirectory 'copilotd-win-x64.zip') -DestinationPath $fixtureDirectory
          $binaryPath = Join-Path $fixtureDirectory 'copilotd.exe'
          foreach ($scenario in @('ExpiredTimestamp', 'GoodBinary', 'TamperedBinary', 'WrongSubject', 'WrongIssuer'))
          {
              ./scripts/Test-InstallerProvenance.ps1 -Scenario $scenario -BinaryPath $binaryPath
          }
          ./scripts/Test-InstallerProvenance.ps1 -Scenario UnsignedBinary -BinaryPath ./scripts/Test-InstallerProvenance.ps1

  validate-shell-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Validate shell script syntax
        shell: bash
        run: ./scripts/verify-shell-syntax.sh

  publish-aot:
    needs: [validate-powershell-scripts, validate-shell-scripts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            rid: linux-x64
          - runner: windows-latest
            rid: win-x64
          - runner: ubuntu-22.04-arm
            rid: linux-arm64
          - runner: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Build and validate NativeAOT publish
        uses: ./.github/actions/build
        with:
          validate-native-aot: 'true'
          aot-runtime-identifier: ${{ matrix.rid }}
